name: CI
on: [push, pull_request]
jobs:
  build-example:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          pip install -r requirements.txt
          npm install
          npx playwright install --with-deps chromium
      - name: Syntax checks
        run: |
          for f in tools/*.mjs projects/example/*.mjs; do node --check "$f"; done
          node --check tools/engine.js projects/example/film/film.js
          python -m py_compile tools/*.py
          bash -n video.sh setup.sh
      - name: Build the example film end to end
        run: PAGES=2 ./video.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: example-film
          path: projects/example/out/*.mp4
